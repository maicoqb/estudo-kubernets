apiVersion: v1
kind: Secret
metadata:
  name: products-service-secret
  namespace: estore
stringData:
  DATABASE_URL: postgresql://store:store123@postgres:5432/products
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-service
  namespace: estore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products-service
  template:
    metadata:
      labels:
        app: products-service
    spec:
      containers:
        - name: products-service
          image: products-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: products-service-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "500m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: products-service
  namespace: estore
spec:
  selector:
    app: products-service
  ports:
    - port: 3000
      targetPort: 3000
  type: LoadBalancer
