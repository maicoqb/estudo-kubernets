apiVersion: batch/v1
kind: Job
metadata:
  name: seed-products
  namespace: estore
spec:
  template:
    spec:
      containers:
        - name: seed
          image: seed-products:latest
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: products-service-secret
                  key: DATABASE_URL
      restartPolicy: Never
  backoffLimit: 3
