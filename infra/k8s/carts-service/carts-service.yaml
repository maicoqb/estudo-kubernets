apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts-service
  namespace: estore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carts-service
  template:
    metadata:
      labels:
        app: carts-service
    spec:
      containers:
        - name: carts-service
          image: carts-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "128Mi"
              cpu: "500m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: carts-service
  namespace: estore
spec:
  selector:
    app: carts-service
  ports:
    - port: 3003
      targetPort: 3000
  type: LoadBalancer
