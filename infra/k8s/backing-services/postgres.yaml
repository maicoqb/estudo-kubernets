apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: estore
stringData:
  POSTGRES_USER: store
  POSTGRES_PASSWORD: store123
  POSTGRES_DB: products
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: estore
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: estore
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
